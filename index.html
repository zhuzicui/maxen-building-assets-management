<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maxen Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky top nav band, then a 1360px content column; most screens are a 260px filter rail + main area. Tokens follow the Maxen V4 Figma file. */
:root{
  --bg:#F4F6F8; --paper:#FFFFFF; --paper-2:#F9FAFB; --field:#F4F6F8;
  --fg:#212B36; --fg-2:#637381; --fg-3:#919EAB; --line:rgba(145,158,171,.24); --line-strong:rgba(145,158,171,.4);
  --primary:#078DEE; --primary-dark:#0351AB; --primary-soft:#E6F4FF; --on-primary:#FFFFFF;
  --brand:#00B8D9; --brand-ink:#0B4A5A;
  --blue:#078DEE; --amber:#FFAB00; --red:#FF5630; --green:#22A06B; --grey-dot:#919EAB;
  --s-grey-bg:#EDEFF2; --s-grey-fg:#454F5B;
  --s-blue-bg:#CAFDF5; --s-blue-fg:#006C9C;
  --s-amber-bg:#FFF5CC; --s-amber-fg:#B76E00;
  --s-red-bg:#FFE9D5; --s-red-fg:#B71D18;
  --s-green-bg:#D3FCD2; --s-green-fg:#118D57;
  --pie-1:#CAF6FF; --pie-2:#61CDFF; --pie-3:#078DEE; --pie-4:#0351AB;
  --scrim:rgba(22,28,36,.48);
  --shadow:0 0 2px rgba(145,158,171,.2),0 12px 24px -4px rgba(145,158,171,.12);
  --shadow-pop:0 0 2px rgba(145,158,171,.24),0 20px 40px -4px rgba(145,158,171,.24);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161C24; --paper:#212B36; --paper-2:#1C252E; --field:#2A3541;
  --fg:#FFFFFF; --fg-2:#C4CDD5; --fg-3:#919EAB; --line:rgba(145,158,171,.2); --line-strong:rgba(145,158,171,.32);
  --primary:#3EA8F5; --primary-dark:#9FD4FF; --primary-soft:rgba(7,141,238,.18);
  --brand:#2FD0EC; --brand-ink:#CFF6FD;
  --s-grey-bg:rgba(145,158,171,.18); --s-grey-fg:#DFE3E8;
  --s-blue-bg:rgba(0,184,217,.18); --s-blue-fg:#61F3F3;
  --s-amber-bg:rgba(255,171,0,.18); --s-amber-fg:#FFD666;
  --s-red-bg:rgba(255,86,48,.18); --s-red-fg:#FFAC82;
  --s-green-bg:rgba(34,197,94,.18); --s-green-fg:#77ED8B;
  --pie-1:#CAF6FF; --pie-2:#61CDFF; --pie-3:#078DEE; --pie-4:#7AB8FF;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 0 2px rgba(0,0,0,.3),0 12px 24px -4px rgba(0,0,0,.3);
  --shadow-pop:0 0 2px rgba(0,0,0,.4),0 20px 40px -4px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161C24; --paper:#212B36; --paper-2:#1C252E; --field:#2A3541;
  --fg:#FFFFFF; --fg-2:#C4CDD5; --fg-3:#919EAB; --line:rgba(145,158,171,.2); --line-strong:rgba(145,158,171,.32);
  --primary:#3EA8F5; --primary-dark:#9FD4FF; --primary-soft:rgba(7,141,238,.18);
  --brand:#2FD0EC; --brand-ink:#CFF6FD;
  --s-grey-bg:rgba(145,158,171,.18); --s-grey-fg:#DFE3E8;
  --s-blue-bg:rgba(0,184,217,.18); --s-blue-fg:#61F3F3;
  --s-amber-bg:rgba(255,171,0,.18); --s-amber-fg:#FFD666;
  --s-red-bg:rgba(255,86,48,.18); --s-red-fg:#FFAC82;
  --s-green-bg:rgba(34,197,94,.18); --s-green-fg:#77ED8B;
  --pie-1:#CAF6FF; --pie-2:#61CDFF; --pie-3:#078DEE; --pie-4:#7AB8FF;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 0 2px rgba(0,0,0,.3),0 12px 24px -4px rgba(0,0,0,.3);
  --shadow-pop:0 0 2px rgba(0,0,0,.4),0 20px 40px -4px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.57;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);box-shadow:var(--shadow)}
.top-in{max-width:1440px;margin:0 auto;height:56px;display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo-btn{display:flex;align-items:center;flex:none;border-radius:50%}
.nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:4px;white-space:nowrap;padding:5px 8px;border-radius:6px;color:var(--fg-2);font-size:14px}
.nav-item:hover{background:var(--field)}
.nav-item.on{background:var(--primary-soft);color:var(--fg);font-weight:600}
.nav-sep{width:1px;height:32px;background:var(--line);margin:0 4px;flex:none}
.top-r{display:flex;align-items:center;gap:12px;flex:none}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--fg-2)}
.icon-btn:hover{background:var(--field)}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden}

/* Popovers */
.pop{position:fixed;z-index:80;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow-pop);padding:4px;min-width:200px}
.pop .mi{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;text-align:left;font-size:14px}
.pop .mi:hover{background:var(--field)}
.pop .mi small{display:block;color:var(--fg-3);font-size:12px}
.pop .pop-head{padding:12px 12px 8px}
.pop .pop-head b{display:block}
.pop .pop-head span{color:var(--fg-2);font-size:13px}
.pop hr{border:0;border-top:1px dashed var(--line-strong);margin:4px 0}
.pop .danger{color:var(--red);font-weight:600}

/* Page */
.page{max-width:1440px;margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.page{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.ph h1{font-size:clamp(24px,3vw,32px);font-weight:700;line-height:1.3;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);font-size:14px;margin-bottom:4px}
.back:hover{color:var(--fg)}
.more{width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg-2);flex:none}
.more:hover{color:var(--fg)}

.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:24px 24px 0}
.card-h h3{font-size:18px;font-weight:700}
.card-f{border-top:1px solid var(--line);display:flex;justify-content:flex-end;padding:8px}
.selects{display:flex;gap:8px;flex-wrap:wrap}
.mini-select{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);font-size:13px;padding:4px 6px;border-radius:6px}
.mini-select:hover{background:var(--field);color:var(--fg)}
.txt-btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:6px 8px;border-radius:8px;color:var(--fg)}
.txt-btn:hover{background:var(--field)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(.92)}
.btn-soft{background:var(--s-grey-bg);color:var(--fg)}
.btn-soft:hover{filter:brightness(.95)}
.btn-ghost-red{color:var(--red)}
.btn-lg{height:48px;font-size:15px;padding:0 22px}
.btn-sm{height:30px;padding:0 10px;font-size:13px}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.c-grey{background:var(--s-grey-bg);color:var(--s-grey-fg)}
.c-blue{background:var(--s-blue-bg);color:var(--s-blue-fg)}
.c-amber{background:var(--s-amber-bg);color:var(--s-amber-fg)}
.c-red{background:var(--s-red-bg);color:var(--s-red-fg)}
.c-green{background:var(--s-green-bg);color:var(--s-green-fg)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:24px}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat b{font-size:30px;font-weight:700;line-height:1.2}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:20px}}

/* Stacked bars */
.bars{padding:24px;display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr);gap:16px;align-items:center;border-radius:8px;padding:2px 8px}
.bar-row.click{cursor:pointer}
.bar-row.click:hover{background:var(--paper-2)}
.bar-name{text-align:right;line-height:1.35}
.bar-name b{display:block;font-size:13px;font-weight:600}
.bar-name span{font-size:12px;color:var(--fg-2)}
.bar-track{display:flex;height:8px;border-radius:4px;overflow:hidden}
.bar-track i{display:block;height:100%}
.legend{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px 24px;padding:0 24px 24px;font-size:13px;color:var(--fg)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* Grid layouts */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.col{display:grid;gap:24px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.tri{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1fr) minmax(0,.84fr);gap:24px;align-items:start}
@media (max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}.tri{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tri>:last-child{grid-column:1/-1}}
@media (max-width:860px){.split,.two,.tri{grid-template-columns:minmax(0,1fr)}}

/* Tabs */
.tabs{display:flex;gap:28px;padding:0 16px;background:var(--paper);border-radius:var(--r) var(--r) 0 0;overflow-x:auto;scrollbar-width:none}
.tabs.solo{border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:24px}
.tab{position:relative;padding:12px 0;font-size:13px;color:var(--fg-2);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary);border-radius:2px}
.subtabs{display:flex;gap:28px;padding:0 16px;overflow-x:auto;scrollbar-width:none;background:var(--field)}
.subtabs.deep{background:color-mix(in srgb,var(--field) 70%,var(--line-strong));border-radius:0 0 var(--r) var(--r)}

/* Recent list */
.timeline{padding:16px 24px 24px;display:grid;gap:0}
.tl{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding-bottom:20px;position:relative}
.tl:not(:last-child)::before{content:"";position:absolute;left:5.5px;top:16px;bottom:2px;width:1px;background:var(--line-strong)}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:4px}
.tl .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg-2)}
.tl b{display:block;font-size:14px;font-weight:600;margin-top:2px}
.tl small{display:block;color:var(--fg-2);font-size:12px;line-height:1.5}

/* Filters */
.filters{padding:24px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.filters{position:static}}
.filters h3{font-size:18px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--fg-2);text-transform:uppercase;margin-top:4px}
.field{position:relative;display:flex;align-items:center;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;gap:8px;background:var(--paper);color:var(--fg-3)}
.field.filled{color:var(--fg)}
.field .fl{position:absolute;top:-8px;left:8px;padding:0 4px;font-size:11px;color:var(--fg-2);background:var(--paper);line-height:16px}
.field input,.field select{border:0;background:transparent;outline:0;flex:1;min-width:0;width:100%;height:38px;color:var(--fg);text-overflow:ellipsis}
.split>*{min-width:0}
.field select{appearance:none;cursor:pointer}
.field select:invalid{color:var(--fg-3)}
.field:focus-within{border-color:var(--fg)}
.f-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--fg)}
.switch input{appearance:none;width:34px;height:20px;border-radius:12px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;width:14px;height:14px;top:3px;left:3px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(14px)}

/* Accordion */
.acc{border-bottom:1px solid var(--line)}
.acc-h{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px 0;font-size:18px;font-weight:700;text-align:left}
.acc-h.dim{color:var(--fg-3)}
.acc-b{padding-bottom:24px}
.chev{transition:transform .2s;color:var(--fg-2)}
.acc.open>.acc-h .chev{transform:rotate(180deg)}

/* WO cards */
.wo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.wo{padding:20px;display:grid;gap:10px;cursor:pointer;transition:box-shadow .2s,transform .2s;text-align:left}
.wo:hover{box-shadow:var(--shadow-pop);transform:translateY(-1px)}
.wo-top{display:flex;align-items:center;gap:8px}
.wo-top .k{margin-left:auto;color:var(--fg-2)}
.wo h4{font-size:15px;font-weight:600}
.wo .due{font-size:13px;font-weight:600}
.wo p{margin:0;font-size:13px;color:var(--fg);line-height:1.6}
.wo ul,.cc ul{list-style:none;margin:0;padding:12px 0 0;border-top:1px dashed var(--line-strong);display:grid;gap:8px}
.wo li,.cc li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2)}
.wo li svg,.cc li svg{flex:none;color:var(--fg-2)}

/* Contact card */
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.cc{padding:16px 20px 20px;display:grid;gap:14px}
.cc-h{display:flex;gap:14px;align-items:center}
.cc-h b{display:block;font-size:14px}
.cc-h span{font-size:12px;color:var(--fg-2)}
.cc-h .k{margin-left:auto;align-self:flex-start;color:var(--fg-2)}
.cc ul{border:0;padding:0;gap:4px}
.copy{color:var(--fg-3);display:inline-grid;place-items:center}
.copy:hover{color:var(--fg)}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
th{text-align:left;color:var(--fg-2);font-weight:600;font-size:12px;padding:16px;background:var(--paper-2);border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px dashed var(--line)}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--paper-2)}
.dense td{padding:6px 16px}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;font-size:13px}
.tfoot .pg{display:flex;align-items:center;gap:20px}
.seg{display:inline-flex;background:var(--paper);border-radius:8px;box-shadow:var(--shadow);padding:4px;gap:4px}
.seg button{width:32px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg-2)}
.seg button.on{background:var(--field);color:var(--fg)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* Asset cards */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.asset{display:flex;align-items:stretch;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:56px;text-align:left;position:relative}
.asset:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.asset .thumb{width:56px;flex:none;display:grid;place-items:center;background:var(--s-grey-bg);color:var(--fg-3)}
.asset .info{padding:8px 12px;display:grid;align-content:center;line-height:1.4;min-width:0}
.asset .info b{font-size:13px;font-weight:600}
.asset .info span{font-size:12px;color:var(--fg-2)}
.asset .par{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--fg-2)}
.asset .tip{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--paper);box-shadow:var(--shadow-pop);border-radius:8px;padding:8px 12px;font-size:12px;white-space:nowrap;display:none;z-index:3;line-height:1.5}
.asset .par:hover+.tip{display:block}
.show-all{display:grid;place-items:center;font-weight:700;font-size:13px;min-height:56px;border-radius:6px}
.show-all:hover{background:var(--paper)}

/* Detail screens */
.kv{display:grid;gap:2px;font-size:14px}
.kv b{font-weight:600}
.sec-label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--fg-2);text-transform:uppercase;margin:24px 0 8px}
.checklist .grp{padding:20px 20px 12px;border-top:1px solid var(--line)}
.checklist .grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px}
.checklist .grp-h b{font-weight:600}
.task{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;color:var(--fg-2);cursor:pointer}
.task input{appearance:none;width:20px;height:20px;border:2px solid var(--fg-3);border-radius:5px;margin:0;display:grid;place-items:center;cursor:pointer;flex:none}
.task input:checked{background:var(--primary);border-color:var(--primary)}
.task input:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task input:checked+span{text-decoration:line-through;color:var(--fg-3)}
.notes{padding:24px 20px;display:grid;gap:16px}
.notes textarea{width:100%;min-height:92px;border:0;border-radius:8px;background:var(--field);padding:12px;resize:vertical;outline:0}
.notes textarea:focus{box-shadow:0 0 0 2px var(--primary)}
.note{display:grid;grid-template-columns:10px minmax(0,1fr);gap:16px;position:relative;padding-bottom:20px}
.note:not(:last-child)::before{content:"";position:absolute;left:4.5px;top:16px;bottom:0;width:1px;background:var(--line-strong)}
.note .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px}
.note p{margin:0;font-weight:500}
.note small{color:var(--fg-2);font-size:12px;display:block;margin:4px 0 8px}
.ph-img{width:54px;height:54px;border-radius:6px;background:var(--s-grey-bg);display:grid;place-items:center;color:var(--fg-3)}
.imgs{display:flex;gap:4px}
.wo-item{display:grid;gap:4px;padding-bottom:16px}
.wo-item small{color:var(--fg-2);font-size:13px}

/* Calendar */

.play .bar-track{transform:scaleX(1);transition:transform .9s cubic-bezier(.22,.9,.25,1) var(--d,0ms)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- charts ---------- */
function curve(pts){ let d=`M${pts[0][0]},${pts[0][1]}`; for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;} return d; }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function lineChart(series,{w=520,h=240,max=100,ticks=[0,20,40,60,80,100]}={}){
  const L=36,R=8,T=10,B=28,iw=w-L-R,ih=h-T-B, x=i=>L+i*iw/11, y=v=>T+ih-(v/max)*ih;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Line chart by month">
   ${ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-8}" y="${y(t)+4}" font-size="10" text-anchor="end">${t}</text>`).join('')}
   ${MONTHS.map((m,i)=>`<text x="${x(i)}" y="${h-8}" font-size="10" text-anchor="middle">${m}</text>`).join('')}
   ${series.map(s=>`<path class="ln" d="${curve(s.v.map((v,i)=>[x(i),y(v)]))}" fill="none" stroke="${s.c}" stroke-width="2"/><circle class="ln-dot" cx="${x(11)}" cy="${y(s.v[11])}" r="4" fill="var(--paper)" stroke="${s.c}" stroke-width="2"/>`).join('')}</svg>`;
}
function pie(){
  const parts=[[35,'var(--pie-1)'],[10,'var(--pie-4)'],[15,'var(--pie-3)'],[40,'var(--pie-2)']]; let a=-Math.PI/2, out='';
  const cx=110,cy=110,r=100;
  parts.forEach(([p,c])=>{const a2=a+p/100*Math.PI*2,lg=p>50?1:0;out+=`<path class="slice" d="M${cx},${cy} L${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} A${r},${r} 0 ${lg} 1 ${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} Z" fill="${c}" stroke="var(--paper)" stroke-width="1.5"/>`;const m=(a+a2)/2;out+=`<text class="slice-label" x="${cx+r*.62*Math.cos(m)}" y="${cy+r*.62*Math.sin(m)+4}" font-size="11" text-anchor="middle" style="fill:${c==='var(--pie-1)'?'#212B36':'#fff'}">${p}%</text>`;a=a2;});
  return `<svg viewBox="0 0 220 220" width="220" style="max-width:100%" role="img" aria-label="Priority split: None 35%, High 10%, Medium 15%, Low 40%">${out}</svg>`;
}
function scatter(w=960,h=210){
  let s=7; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const L=36,T=10,B=26,ih=h-T-B,iw=w-L-8, y=v=>T+ih/2-(v/10)*(ih/2);
  let pts='';
  [['var(--red)',2.2],['var(--grey-dot)',0],['var(--green)',-2.2]].forEach(([c,base])=>{for(let i=0;i<260;i++){const x=L+rnd()*iw; const v=base+(rnd()+rnd()+rnd()-1.5)*2.2*(rnd()<.08?2.4:1); pts+=`<circle class="dot-pt" cx="${x.toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.6" fill="${c}" opacity=".55"/>`;}});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Duration variance scatter by month">${[10,5,0,-5,-10].map(t=>`<text x="${L-8}" y="${y(t)+4}" font-size="10" text-anchor="end">${t>0?'+'+t:t}</text><line x1="${L}" x2="${w-8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join('')}
  ${MONTHS.map((m,i)=>`<text x="${L+i*iw/11}" y="${h-6}" font-size="10" text-anchor="middle">${m}</text>`).join('')}${pts}</svg>`;
}
function ring(score){ const r=70,c=2*Math.PI*r; return `<svg viewBox="0 0 180 180" width="180" style="max-width:100%;justify-self:center" role="img" aria-label="Building score ${score} out of 100"><circle cx="90" cy="90" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="10"/><circle class="ring-arc" cx="90" cy="90" r="${r}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" style="--c:${c};--off:${c*(1-score/100)}" transform="rotate(-90 90 90)"/><text x="90" y="72" text-anchor="middle" font-size="12" style="fill:#fff">Building score</text><text data-count x="90" y="104" text-anchor="middle" font-size="34" font-weight="700" style="fill:#fff">${score}</text><text x="90" y="126" text-anchor="middle" font-size="12" style="fill:#fff">Very good</text></svg>`; }

function statsRow(vals){ const lab=['Planned','Ready','In progress','On hold','Overdue','Completed']; return `<div class="stats num">${vals.map((v,i)=>`<div class="stat"><b data-count>${v}</b>${chip(lab[i])}</div>`).join('')}</div>`; }
function assigneeBars(n=10,clickJon=false){
  return `<div class="bars">${Array.from({length:n},(_,i)=>{const jon=clickJon&&i===5;return `<div class="bar-row ${clickJon?'click':''}" ${clickJon?`data-go="${jon?'assignee-jon':'assignee-jon'}"`:''}><div class="bar-name"><b>${jon?'Jon Snow':'Firstname Lastname'}</b><span>Company</span></div>${bar(BARSETS[i%10])}</div>`;}).join('')}</div>`;

/* calendar */
const EVENTS = {3:[['red'],['amber'],['ghost'],12],4:[['ghost'],['ghost'],['ghost'],['ghost']],5:[['ghost'],['ghost'],['ghost'],4],6:[['amber'],['ghost'],['ghost']],7:[['ghost'],['ghost']],10:[['ghost'],['ghost']],11:[[''],['ghost'],['ghost']],12:[[''],[''],[''],7],13:[[''],[''],[''],['']],17:[[''],['']],18:[[''],[''],[''],4],19:[['']],20:[[''],['']],21:[['']]};
S.calendar = () => {
  const y=state.year,m=state.month, first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), prevDim=new Date(y,m,0).getDate();
  const isDec22 = y===2022&&m===11;
  const cells=[]; const total=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<total;i++){const d=i-first+1; const inM=d>=1&&d<=dim; const label=inM?d:(d<1?prevDim+d:d-dim);
    let evs=''; if(inM&&isDec22&&EVENTS[d]) evs=EVENTS[d].map(e=>typeof e==='number'?`<div class="morel">+${e} more</div>`:`<button class="ev ${e[0]}" data-ev="${d}">Name of work order</button>`).join('');
    const key=`${y}-${m}-${d}`; if(inM&&state.placed[key]) evs+=state.placed[key].map(()=>`<button class="ev new" data-ev="${d}">Name of work order</button>`).join('');
    const off = isDec22&&[25,26].includes(d);
    cells.push(`<div class="day ${inM?'':'out'} ${isDec22&&d===5?'today':''} ${off?'off':''}" ${inM&&!off?`data-day="${key}"`:''}><div class="dn"><span>${label}</span></div>${evs}</div>`);}
  const prev=[['Overdue'],['Overdue'],['On hold'],['On hold'],['On hold']];
  const qi=(s,id)=>`<div class="qi" draggable="true" ${id?`data-q="${id}"`:''}>${chip(s)}<b>8h</b><span>Name of work order</span></div>`;
  return header('analytics') + `<main class="page">${pageHead('Schedule work order in calendar',{back:'building-wo'})}
  <div class="cal-layout"><div class="col" style="gap:16px">
   <label class="field filled"><span class="fl">Buildings</span><select id="cal-bldg" aria-label="Building"><option>Maison de Radio-Canada</option><option>Toit des Studios</option></select>${ic('chev',18)}</label>
   ${acc('cprev','Work orders from previous months',`<div class="queue">${prev.map(([s])=>qi(s)).join('')}</div>`,{open:true})}
   ${acc('cdec','Work orders planned for December 2022',`<div class="queue">${state.queue.length?state.queue.map(q=>qi(q.status,q.id)).join(''):'<p style="color:var(--fg-2);margin:0">All planned work orders are on the calendar.</p>'}</div><p style="font-size:12px;color:var(--fg-2);margin:12px 0 0">Drag a work order onto a day to schedule it.</p>`,{open:true})}
   ${acc('cjan','Work orders planned for January 2023',`<div class="queue">${qi('Planned')}${qi('Planned')}</div>`)}
  </div>
  <section class="card" style="overflow:hidden"><div class="cal-h"><div class="seg2" role="group" aria-label="Calendar range">${['Month','Week','Day'].map(v=>`<button class="${state.calView===v?'on':''}" data-calv="${v}">${v}</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:8px"><button class="icon-btn" data-mon="-1" aria-label="Previous month">${ic('chevL',20)}</button><h3>${['January','February','March','April','May','June','July','August','September','October','November','December'][m]} ${y}</h3><button class="icon-btn" data-mon="1" aria-label="Next month">${ic('chevR',20)}</button></div>
    <div style="display:flex;gap:8px"><button class="btn btn-soft btn-sm" data-act="toast" data-msg="Working days: Monday to Friday">Define working days</button><button class="btn btn-primary btn-sm" data-act="today">Take me to TODAY</button></div></div>
   <div class="cal-wrap"><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div></div></section></div></main>`;
};

const ff = (label,val='',{select,sub,ph,area,opts}={}) => { const id='i-'+Math.random().toString(36).slice(2,8);
  if(area) return `<div class="ff"><textarea id="${id}" placeholder="${label}" aria-label="${label}" rows="3">${val}</textarea></div>`;
  if(select) return `<div class="ff">${val?`<label for="${id}">${label}</label>`:''}<div class="ind">${sub?ic('sub',16):''}<select id="${id}" aria-label="${label}" style="${val?'':'color:var(--fg-3)'}">${val?`<option>${val}</option>`:`<option value="">${label}</option>`}${(opts||['Option A','Option B']).map(o=>`<option>${o}</option>`).join('')}</select></div><span class="sc">${ic('chev',18)}</span></div>`;
  return `<div class="ff">${val?`<label for="${id}">${label}</label>`:''}<input id="${id}" value="${val}" placeholder="${val?'':(ph||label)}" aria-label="${label}"></div>`; };

  <div><h1 style="font-size:32px;margin-bottom:16px">Communication preferences</h1><section class="card" style="padding:24px;display:grid;gap:4px">
   <div class="flabel" style="margin-bottom:8px">Email me when</div>
   ${['A work order is assigned to me','A work order I follow changes status','A work order becomes overdue','Someone leaves a note on my work order','A weekly summary of my buildings is ready'].map((t,i)=>`<label class="task" style="color:var(--fg)"><input type="checkbox" ${i<3?'checked':''} data-pref="${i}"><span style="text-decoration:none;color:var(--fg)">${t}</span></label>`).join('')}</section></div></div></main>`;

/* ---------- router ---------- */
const ROUTES = Object.keys(S);
function render(){
  let r = location.hash.slice(1) || 'login';
  if(!ROUTES.includes(r)) r='login';
  if(r!=='login' && !state.authed){ state.authed=true; }
  closePop();
  document.getElementById('app').innerHTML = S[r]();
  document.title = 'Maxen Prototype';
  bindDnD();
  armCharts(r);
}
window.addEventListener('hashchange',()=>{animSeen.clear();render();window.scrollTo(0,0);});

/* ---------- chart entrance animations ---------- */
const animSeen = new Set();
let chartIO = null;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function countUp(el){
  if(el.dataset.final==null) el.dataset.final = el.textContent.trim();
  const raw = el.dataset.final, target = parseFloat(raw.replace(/,/g,'')); if(isNaN(target)) return;
  const comma = raw.includes(','), t0 = performance.now(), dur = 1100;
  const fmt = (v) => comma ? Math.round(v).toLocaleString('en-US') : String(Math.round(v));
  el.textContent = fmt(0);
  const step = (t) => { const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3); el.textContent = fmt(target*e); if(p<1) requestAnimationFrame(step); else el.textContent = raw; };
  requestAnimationFrame(step);
}
function prepChart(root){
  if(root.classList.contains('bars')) root.querySelectorAll('.bar-row').forEach((row,i)=>row.style.setProperty('--d',`${i*55}ms`));
  if(root.classList.contains('stats')) root.querySelectorAll('.stat').forEach((s,i)=>s.style.setProperty('--d',`${200+i*70}ms`));
  if(root.classList.contains('legend')) root.querySelectorAll('span').forEach((s,i)=>s.style.setProperty('--d',`${500+i*80}ms`));
  if(root.tagName==='svg'){
    root.querySelectorAll('path.ln').forEach((p,i)=>{ const len=Math.ceil(p.getTotalLength()); p.style.strokeDasharray=len; p.style.setProperty('--len',len); p.style.setProperty('--d',`${i*250}ms`); });
    root.querySelectorAll('.ln-dot').forEach((c,i)=>c.style.setProperty('--d',`${1250+i*250}ms`));
    root.querySelectorAll('.slice').forEach((s,i)=>s.style.setProperty('--d',`${i*120}ms`));
    root.querySelectorAll('.slice-label').forEach((s,i)=>s.style.setProperty('--d',`${500+i*120}ms`));
    const w = root.viewBox.baseVal.width || 960;
    root.querySelectorAll('.dot-pt').forEach(c=>c.style.setProperty('--d',`${Math.round(c.cx.baseVal.value/w*1300)}ms`));
  }
}
function playChart(root){
  root.classList.add('play');
  root.querySelectorAll('[data-count]').forEach(countUp);
  // clean up once everything has finished so later re-renders or theme changes are unaffected
  setTimeout(()=>{ root.classList.remove('armed','play'); }, 3200);
}
function armCharts(route){
  if(chartIO){ chartIO.disconnect(); chartIO=null; }
  if(reduceMotion.matches || !('IntersectionObserver' in window)) return;
  const roots = [...document.querySelectorAll('#app .bars, #app .stats, #app .legend, #app svg')]
    .filter(el => el.tagName!=='svg' || el.querySelector('.ln, .slice, .dot-pt, .ring-arc'));
  if(!roots.length) return;
  chartIO = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(!en.isIntersecting) return; chartIO.unobserve(en.target); requestAnimationFrame(()=>requestAnimationFrame(()=>playChart(en.target))); });
  },{threshold:0.2, rootMargin:'0px 0px -40px 0px'});
  roots.forEach((el,i)=>{
    const key = route+':'+i;
    if(animSeen.has(key)) return;   // already played on this visit, e.g. after an accordion re-render
    animSeen.add(key);
    prepChart(el);
    el.classList.add('armed');
    chartIO.observe(el);
  });
}
const go = (r) => { if(location.hash==='#'+r) render(); else location.hash=r; };

/* ---------- popovers ---------- */
const layer = document.getElementById('layer');
function closePop(){ layer.innerHTML=''; }
function openPop(kind,anchor){
  const r = anchor.getBoundingClientRect();
  const menus = {
    logo:`<div class="pop-head"><b>Switch view</b><span>Prototype roles</span></div><button class="mi" data-go="analytics">Portfolio manager<small>All buildings, analytics home</small></button><button class="mi" data-go="building">Only one building<small>Lands on Maison de Radio-Canada</small></button><button class="mi" data-go="tech">Technician<small>Only my work orders</small></button>`,
    buildings:`<button class="mi" data-go="building">${ic('bldg',18)} Maison de Radio-Canada</button><button class="mi" data-act="toast" data-msg="Only Maison de Radio-Canada is in this prototype">${ic('bldg',18)} Toit des Studios</button>`,
    account:`<div class="pop-head"><b>Hudson Alvarez</b><span>design@email.com</span></div><hr><button class="mi" data-go="profile">Profile</button><button class="mi" data-go="mywo">My work orders</button><hr><button class="mi danger" data-act="logout">${ic('logout',18)} Logout</button>`,
    more:`<button class="mi" data-go="new-asset">${ic('plus',18)} Create new asset</button><button class="mi" data-go="new-wo">${ic('plus',18)} Create new work order</button>`,
    status:['Planned','Ready','In progress','On hold','Overdue','Completed'].map(s=>`<button class="mi" data-status="${s}">${chip(s)}</button>`).join('')
  };
  layer.innerHTML = `<div class="pop" role="menu">${menus[kind]}</div>`;
  const p = layer.firstChild, w = p.offsetWidth;
  let left = Math.min(r.left, window.innerWidth - w - 12); if(kind==='account'||kind==='more') left = Math.max(12, r.right - w);
  p.style.left = Math.max(12,left)+'px'; p.style.top = (r.bottom+8)+'px';
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status'); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function checklistModal(){
  const tasks=['Task 1 Occaecati est et illo quibusdam accusamus','Add SCSS and JS files if required','Stakeholder Meeting','Task 4 Occaecati est et illo quibusdam accusamus','Task 5 Take temperature of something'];
  layer.innerHTML = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><h3 id="mh">Checklist</h3><b>Panneaux solaires</b>
   ${tasks.map((t,i)=>`<label class="task" style="color:var(--fg)"><input type="checkbox" data-mcheck="${i}" ${state.modalChecks[i]?'checked':''}><span>${t}</span></label>${i===4?`<div class="frow" style="padding-left:32px;max-width:340px">${ff('Temperature','16')}${ff('Unit','Celsius',{select:true,opts:['Fahrenheit']})}</div>`:''}`).join('')}
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><button class="btn btn-ghost-red" data-close="1">Don't save</button><button class="btn btn-primary btn-lg" data-act="saveprog">Save progress</button></div></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',(e)=>{
  const t = e.target.closest('[data-pop],[data-go],[data-act],[data-acc],[data-view],[data-wing],[data-floor],[data-atab],[data-pin],[data-calv],[data-mon],[data-status],[data-copy],[data-close],[data-sec]');
  if(!t){ if(!e.target.closest('.pop')) closePop(); return; }
  if(t.dataset.close && e.target!==t && !e.target.closest('button[data-close]')) return;
  const d=t.dataset;
  if(d.pop){ e.preventDefault(); const open=layer.querySelector('.pop'); if(open&&layer.dataset.k===d.pop){closePop();layer.dataset.k='';return;} layer.dataset.k=d.pop; openPop(d.pop,t); return; }
  if(d.go){ e.preventDefault(); closePop(); go(d.go); return; }
  if(d.close){ closePop(); return; }
  if(d.acc){ const cur=t.getAttribute('aria-expanded')==='true'; state.open[d.acc]=!cur; render(); return; }
  if(d.view){ state.woView=d.view; render(); return; }
  if(d.wing){ state.wing=d.wing; render(); return; }
  if(d.floor){ state.floor=d.floor; render(); return; }
  if(d.atab){ state.assetTab=d.atab; render(); return; }
  if(d.calv){ state.calView=d.calv; if(d.calv!=='Month') toast(`${d.calv} view isn't designed yet, showing Month`); state.calView='Month'; render(); return; }
  if(d.mon){ state.month+=+d.mon; if(state.month<0){state.month=11;state.year--;} if(state.month>11){state.month=0;state.year++;} render(); return; }
  if(d.status){ state.woStatus=d.status; closePop(); render(); toast(`Status changed to ${d.status}`); return; }
  if(d.pin!==undefined){ const n=state.notes.splice(+d.pin,1)[0]; state.notes.forEach(x=>x.pinned=false); n.pinned=true; state.notes.unshift(n); render(); toast('Note pinned'); return; }
  if(d.copy){ e.preventDefault(); const v=d.copy; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied '+v)).catch(()=>toast(v)); return; }
  if(d.sec){ document.querySelectorAll('.side-nav a').forEach(a=>a.classList.toggle('on',a===t)); e.preventDefault(); document.getElementById(d.sec).scrollIntoView({behavior:'smooth'}); return; }
  switch(d.act){
    case 'theme': { const root=document.documentElement; const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; break; }
    case 'lang': toast('French translation is not in this prototype'); break;
    case 'pw': { e.preventDefault(); const i=document.getElementById('l-pw'); i.type=i.type==='password'?'text':'password'; break; }
    case 'forgot': e.preventDefault(); toast('Password reset link sent to design@email.com'); break;
    case 'logout': closePop(); state.authed=false; go('login'); break;
    case 'reset': document.querySelectorAll('.filters select').forEach(s=>s.selectedIndex=0); document.querySelectorAll('.filters input').forEach(i=>{i.value='';i.checked=false;}); toast('Filters reset'); break;
    case 'apply': toast('Filters applied'); break;
    case 'toast': e.preventDefault(); toast(d.msg); break;
    case 'checklist': checklistModal(); break;
    case 'saveprog': state.checks.a=[...state.modalChecks]; closePop(); render(); toast('Progress saved'); break;
    case 'post': { const v=document.getElementById('note-text').value.trim(); if(!v){toast('Write a note first');return;} const pinned=state.notes.filter(n=>n.pinned); const rest=state.notes.filter(n=>!n.pinned); state.notes=[...pinned,{text:v,who:'Hudson Alvarez',when:'Just now'},...rest]; render(); toast('Note posted'); break; }
    case 'today': state.month=11; state.year=2022; render(); break;
    case 'cancel': history.length>1?history.back():go('building'); break;
    case 'save': { const f=document.getElementById('the-form'); const name=f.querySelector('input'); if(name&&!name.value.trim()){ name.focus(); toast('Add a name before saving'); return;} toast(d.msg.replace(' done',' saved').replace('Create ','')+''); setTimeout(()=>go(location.hash==='#new-wo'?'wo':'asset'),700); break; }
  }
});
document.addEventListener('change',(e)=>{
  const d=e.target.dataset;
  if(d.check){ const [k,i]=d.check.split(':'); state.checks[k][+i]=e.target.checked; if(k==='c') render(); return; }
  if(d.mcheck!==undefined){ state.modalChecks[+d.mcheck]=e.target.checked; return; }
  if(e.target.id==='dense'){ state.dense=e.target.checked; render(); }
});
document.addEventListener('submit',(e)=>{
  if(e.target.id!=='login-form') return; e.preventDefault();
  const pw=document.getElementById('l-pw'); const ok=pw.value.length>0;
  document.getElementById('pw-box').classList.toggle('err',!ok); document.getElementById('pw-err').hidden=ok;
  if(ok){ state.authed=true; go('analytics'); } else pw.focus();
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closePop(); });
window.addEventListener('scroll',()=>{ if(layer.querySelector('.pop')) closePop(); },{passive:true});

/* calendar tooltip + drag-and-drop */
let tip=null;
document.addEventListener('mouseover',(e)=>{
  const ev=e.target.closest('.ev'); if(!ev){ if(tip){tip.remove();tip=null;} return; }
  if(tip) return; const r=ev.getBoundingClientRect();
  tip=document.createElement('div'); tip.className='ev-tip';
  tip.innerHTML=`${chip('Ready')}<b>Work order name</b>Little description of the work order (optional)<br>Building: Maison de Radio-Canada<br>Recurrence: Annually<br>Assignee: Cristopher Cardenas<br>Estimated duration: 1 day<br>Due date: 12/${String(ev.dataset.ev).padStart(2,'0')}/2022<br>Priority: High`;
  document.body.appendChild(tip);
  const left = r.right+10+280>window.innerWidth ? r.left-290 : r.right+10;
  tip.style.left=Math.max(8,left)+'px'; tip.style.top=Math.min(r.top,window.innerHeight-260)+'px';
});
document.addEventListener('click',(e)=>{ const ev=e.target.closest('.ev'); if(ev){ if(tip){tip.remove();tip=null;} go('wo'); } });
function bindDnD(){
  document.querySelectorAll('.qi[draggable]').forEach(el=>{ el.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/plain',el.dataset.q||''); ev.dataTransfer.effectAllowed='move'; }); });
  document.querySelectorAll('.day[data-day]').forEach(day=>{
    day.addEventListener('dragover',ev=>{ev.preventDefault();day.classList.add('drop');});
    day.addEventListener('dragleave',()=>day.classList.remove('drop'));
    day.addEventListener('drop',ev=>{ ev.preventDefault(); const id=ev.dataTransfer.getData('text/plain'); const k=day.dataset.day;
      (state.placed[k]=state.placed[k]||[]).push(id); if(id) state.queue=state.queue.filter(q=>q.id!==id); render(); toast(`Scheduled for ${k.split('-')[2]} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+k.split('-')[1]]}`); });
  });
}
render();
</script>
